name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FieldGrow ${{ github.ref_name }}"
          releaseBody: |
            ## FieldGrow ${{ github.ref_name }}

            地推拓客利器 —— 地图商户检索 / 商户信息管理 / 一键导出。

            ### 安装说明
            - **Windows**:下载 `-setup.exe`(推荐)或 `.msi`
            - **macOS**:下载 `.dmg`;首次打开需在「系统设置 → 隐私与安全性」中允许(未签名)
            - **Linux**:下载 `.AppImage`(需 `chmod +x`)或 `.deb`

            首次使用请在「设置」中填入你的高德「Web服务」Key(详见 README)。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
