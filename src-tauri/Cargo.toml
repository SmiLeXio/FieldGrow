[package]
name = "field-grow"
version = "0.2.8"
description = "FieldGrow · 地推拓客利器 — 地图商户检索 / 信息管理 / 一键导出"
authors = ["SmiLeXio"]
edition = "2021"
repository = "https://github.com/SmiLeXio/FieldGrow"
license = "MIT"

[lib]
name = "field_grow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
